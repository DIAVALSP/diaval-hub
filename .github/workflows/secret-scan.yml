name: secret-scan
on: [push, pull_request]
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # A gitleaks-action@v2 exige licenca paga quando o repo e de organizacao
      # (DIAVALSP desde 29/09/2026) e falhava em 4s com "missing gitleaks license".
      # O binario do gitleaks e livre (MIT): mesma varredura, sem licenca.
      # Escaneia so os commits do evento, como a action fazia.
      - name: gitleaks
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          if [ -n "$BASE" ]; then
            RANGE="$BASE..$HEAD_SHA"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            RANGE="$BEFORE..$HEAD_SHA"
          else
            RANGE="$HEAD_SHA"
          fi
          echo "Escaneando $RANGE"
          ./gitleaks git . --redact -v --log-opts="$RANGE"
